# Run with: docker compose up --build
# Values come from .env when it exists (Compose reads it automatically),
# otherwise from the defaults below.
services:
  api:
    build: .
    image: era-mock-api-rest:local
    ports:
      # 0.0.0.0 publishes on IPv4 only. Without it Docker also listens on [::],
      # which may be reachable from the internet, and host firewalls such as ufw
      # do not filter published ports.
      - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-era-mock-api-secret-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MOCK_DELAY_MS: ${MOCK_DELAY_MS:-0}
      MOCK_ERROR_RATE: ${MOCK_ERROR_RATE:-0}
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
